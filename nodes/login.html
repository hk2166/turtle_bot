<!doctype html>
<!-- Written 2026-10-13: admin login for the dashboard (nodes/dashboard.py, /login). -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMPUS BOT // ADMIN</title>
<style>
:root{--bg:#060a06;--panel:#0a120a;--line:#1d3a1d;--fg:#49f07a;--dim:#2c7a46;--bad:#ff5566}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "SF Mono","Fira Code",ui-monospace,Menlo,monospace;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px}
h1{font-size:15px;letter-spacing:3px;margin-bottom:16px}
input,button{width:100%;font:inherit;font-size:15px;padding:12px;border-radius:5px;margin-top:10px}
input{background:#0f1d0f;border:1px solid var(--line);color:var(--fg)}
button{background:#0f1d0f;border:1px solid var(--fg);color:var(--fg);letter-spacing:2px;cursor:pointer}
button:hover{background:var(--fg);color:#04140a}
#msg{color:var(--bad);min-height:1.5em;margin-top:10px;font-size:13px}
a{color:var(--dim)}
#netbar{display:none;flex:none;margin:0;padding:8px 10px;border:1px solid var(--fg);border-radius:6px;font-size:13px;line-height:2}
#netbar button{width:auto;margin:0 6px;padding:4px 10px;font-size:12px}
#netbar label{font-size:12px;white-space:nowrap}#netbar input{width:auto;margin:0 4px 0 0}
</style></head><body>
<form class="box" onsubmit="go(event)">
 <h1>▚ CAMPUS BOT · ADMIN</h1>
 <div id="netbar"></div>
 <label for="pw" style="color:var(--dim);font-size:12px">ADMIN PASSWORD</label>
 <input id="pw" type="password" autocomplete="current-password" autofocus>
 <button type="submit">LOG IN</button>
 <div id="msg"></div>
 <p style="margin-top:14px;font-size:12px"><a href="/">← Back to calling the robot</a></p>
</form>
<script>
async function go(e){e.preventDefault();const m=document.getElementById('msg');m.textContent='checking…';
 try{const r=await (await fetch('/api/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pw').value})})).json();
  if(r.ok)location.href='/admin';else m.textContent=r.msg}catch(_){m.textContent='robot not reachable'}}
// ---- same WiFi as the robot? (2026-10-30) On the internet link, offer the direct WiFi address (much
// faster video) with a one-time pass so you stay logged in; on the direct page, offer the internet link
// when the robot stops answering (you left the WiFi).
const NB=document.getElementById('netbar');
function nbShow(html){NB.innerHTML=html;NB.style.display=html?'':'none'}
async function lanSwitch(lan){
 try{const h=await(await fetch('/api/lan/handoff')).json();if(h.ok){location.href=h.url;return}}catch(e){}
 location.href=lan+'/login'}
function lanAuto(on){try{localStorage.setItem('autoLan',on?'1':'0')}catch(e){}}
let REMOTE_URL='';
(async()=>{let r;try{r=await(await fetch('/api/lan')).json()}catch(e){return}
 if(r.direct){REMOTE_URL=r.remote||'';return}
 if(!r.same||!r.lan)return;
 const ok=await new Promise(res=>{const i=new Image(),t=setTimeout(()=>res(false),2500);
  i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=r.lan+'/lan_ping.gif?t='+Date.now()});
 let auto=false;try{auto=localStorage.getItem('autoLan')=='1'}catch(e){}
 if(ok&&auto)return lanSwitch(r.lan);
 nbShow(`📶 You're on the robot's WiFi: the direct connection is much faster.
  <button onclick="lanSwitch('${r.lan}')">⚡ SWITCH TO DIRECT</button>
  <label><input type="checkbox" onchange="lanAuto(this.checked)"${auto?' checked':''}> always</label>`+
  (ok?'':`<br><small>first time: the browser warns about the robot's own certificate: choose Advanced → Proceed.</small>`))})();
</script></body></html>
