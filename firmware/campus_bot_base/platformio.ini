; RECONSTRUCTED from the ESP32 flash dump (2026-10-01) — not yet run on the robot.
; The dump shows: PlatformIO + Arduino core 2.x (ESP-IDF v4.4.7), board "Adafruit Feather ESP32-S3"
; (used as a generic S3 target for the Edgebax S3-PRO), micro-ROS serial over the native USB CDC.
;
;   firmware/build.sh                         # build only (from the repo root)
;   bash setup/04_backup_esp32.sh             # ALWAYS back up the chip before the first upload
;   firmware/build.sh upload                  # flash (asks for confirmation)
;   pio device monitor -p <UART port> -b 115200   # the [campus_bot] / [imu] / [drive] log is on UART0
;
; Use build.sh rather than a bare `pio run`: micro-ROS must be built outside the ROS environment that
; ~/.bashrc sources ("No 'rosidl_typesupport_cpp' found" otherwise), and with a pipx install of
; PlatformIO it needs ~/.platformio/penv (build.sh links it). The first build compiles micro-ROS
; from source (~7 min on the Pi 5 with a good connection).
[env:campus_bot]
platform = espressif32 @ 6.7.0           ; Arduino core 2.0.16 / IDF 4.4.7, the generation in the dump
board = adafruit_feather_esp32s3
framework = arduino
; Flash layout read from the original image (2026-10-01): DIO, 80 MHz, 8 MB, default_8MB.csv
; partitions (app0/app1 3.2 MB, spiffs, coredump). The board profile alone would say 4 MB.
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.partitions = default_8MB.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 921600
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    gin66/FastAccelStepper @ ^0.31.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1          ; Serial = native USB (micro-ROS), Serial0 = UART0 (log)
