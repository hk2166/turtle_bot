# campus_bot: the robot's software (camera_node, dashboard, look.py, face verification) opens
# /dev/video0 directly; PipeWire kept grabbing it and starving them. No desktop app on this
# machine needs a camera, so V4L2 monitoring is off.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
